# Keeps dependencies and CI actions on supported versions.
# PRs from Dependabot trigger the same required CI checks as any other PR.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Held on purpose: `eslint-config-next` 16.x bundles
      # eslint-plugin-{import,jsx-a11y,react}, whose peer ranges cap at
      # eslint 9, so eslint 10 installs with unresolved peer conflicts.
      # Same reason the eslint 10 bump was reverted — remove this rule once
      # those plugins (or the Next lint stack) support eslint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
