services:
  db:
    image: postgres:16-alpine
    container_name: ecomcolab-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecomcolab
      POSTGRES_PASSWORD: ecomcolab
      POSTGRES_DB: ecomcolab
    ports:
      #5433: a local PostgreSQL may already own5432 on this machine.
      - "5433:5432"
    volumes:
      - ecomcolab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecomcolab -d ecomcolab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ecomcolab_pgdata:
